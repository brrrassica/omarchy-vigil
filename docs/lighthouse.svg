    <rect x="80" y="90" width="80" height="130" fill="#d4be98"/>
    <rect x="80" y="112" width="80" height="20" fill="#ea6962"/>
    <rect x="80" y="154" width="80" height="20" fill="#ea6962"/>
    <rect x="80" y="196" width="80" height="20" fill="#ea6962"/>
  </g>
  <!-- door -->
