<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260">
  <defs>
    <linearGradient id="beamL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#d8a657" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d8a657" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8a657" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d8a657" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tower"><path d="M101 92 H139 L152 214 H88 Z"/></clipPath>
  </defs>
  <!-- light beams -->
  <path d="M120 70 L4 38 L4 102 Z" fill="url(#beamL)"/>
  <path d="M120 70 L236 38 L236 102 Z" fill="url(#beamR)"/>
