  <path d="M20 236 q15 -9 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0" fill="none" stroke="#7daea3" stroke-width="5" stroke-linecap="round"/>
  <path d="M40 251 q15 -9 30 0 t30 0 t30 0 t30 0 t30 0 t30 0" fill="none" stroke="#7daea3" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
