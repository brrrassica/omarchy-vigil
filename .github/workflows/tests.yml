# Runs Vigil's tests on every push to master and every pull request.
#
# Hardened on purpose:
# - No third-party actions at all (not even actions/checkout): the code is
#   fetched with plain git from the public repository, so no action's
#   maintainer can change what runs here.
# - The job's token has no permissions (`permissions: {}`): it can read
#   nothing private and write nothing, so even a malicious pull request that
#   runs here cannot push, comment, or touch releases.
# - Only `pull_request`, never `pull_request_target`: code from a fork never
#   runs with this repository's secrets (it has none) or a write token.
# - The only installs are pytest and its three dependencies, pinned by version
#   and SHA-256 in .github/ci-requirements.txt (pip --require-hashes), wheels
#   only, so nothing is built or run from a source package.
# - Values from the event reach the shell only through environment
#   variables, never pasted into a script.
name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

concurrency:
  group: tests-${{ github.ref }}
  # A newer push to a pull request replaces its older run; runs on master all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out (plain git, no action)
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git fetch -q --depth=1 --no-tags "https://github.com/$REPO" "$SHA"
          git checkout -q FETCH_HEAD
          git log -1 --format='Testing %H'

      - name: Install pytest, pinned by hash
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q --disable-pip-version-check --only-binary=:all: \
            --require-hashes -r .github/ci-requirements.txt

      - name: Helper and marketplace rules (Python)
        run: '"$RUNNER_TEMP/venv/bin/python" -m pytest -q -p no:cacheprovider tests'

      - name: Panel model (Node)
        run: node --test tests/model.test.mjs
